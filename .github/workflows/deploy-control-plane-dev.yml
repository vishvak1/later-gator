name: Validate and deploy control plane

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: later-gator-control-plane-development
  cancel-in-progress: false

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate runtime and extension
        run: npm run check

      - name: Validate managed BYOC control plane
        run: npm run check:managed-byoc

      - name: Require committed generated release artifacts
        run: git diff --exit-code

  deploy-development:
    name: Deploy development control plane
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: control-plane-development
      url: https://later-gator-control-plane-dev.vishvak-v.workers.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply additive control-plane schema
        run: npm run db:init:development --workspace @later-gator/control-plane

      - name: Deploy development control plane
        run: npm run deploy:development --workspace @later-gator/control-plane
